<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/icon/favicon.ico"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>YouTube</title>

    <!-- Apply Theme Before React Loads -->
    <script>
      (() => {
        const storageKey =
          "youtube-clone-theme";

        const storedTheme =
          localStorage.getItem(storageKey);

        let resolvedTheme;

        if (
          storedTheme === "light"
        ) {
          resolvedTheme = "light";
        } else if (
          storedTheme === "dark"
        ) {
          resolvedTheme = "dark";
        } else {
          resolvedTheme =
            window.matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches
              ? "dark"
              : "light";
        }

        document.documentElement.setAttribute(
          "data-theme",
          resolvedTheme,
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
